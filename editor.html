<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="NaidaBureau — Наталія Найда, дизайнерка і фулстак-розробниця: застосунки, сайти, віджети.">
<meta property="og:title" content="NaidaBureau">
<meta property="og:description" content="Design &amp; fullstack code: застосунки, сайти, віджети.">
<title>NaidaBureau — живий редактор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@300;400;500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Сайт як редактор: шари ліворуч, полотно в центрі, інспектор праворуч, код знизу */
:root{
  --ink:#0B0B0D; --panel:#121215; --panel2:#18181C; --line:#26262C; --paper:#F4F2EC; --muted:#A3A1AA; --lime:#D7FF3D; --sel:#7CF3FF; --red:#FF6B5E;
  --f-display:'Dela Gothic One','Arial Black',sans-serif; --f-body:'Manrope',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:13px;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* верх */
.top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:14px;white-space:nowrap}
.logo .m{display:flex;align-items:center;font-size:19px;line-height:1}.logo i{font-family:var(--f-mono);font-weight:300;font-style:normal;color:var(--lime)}
.file{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file b{color:var(--paper);font-weight:500}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);gap:2px;margin-left:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:700;border:0;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.g{background:none;border:1px solid var(--line);color:var(--paper)}
.back{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.back:hover{color:var(--paper)}
.collab{display:flex;align-items:center}
.collab span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--panel);margin-left:-6px}
/* основа */
.main{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;min-height:0}
.left,.right{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line)} .right{border-left:1px solid var(--line)}
.sec{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left}
.row:hover{background:#ffffff08}
.row[aria-current="true"],.row.on{background:#d7ff3d1a;color:var(--lime)}
.row .ic{width:16px;text-align:center;font-family:var(--f-mono);color:var(--muted)}
.row .eye{margin-left:auto;opacity:.5;font-family:var(--f-mono);font-size:11px;background:none;border:0;cursor:pointer;padding:2px 4px}
.row .eye:hover{opacity:1}
/* полотно */
.stage{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:
  radial-gradient(circle,#ffffff14 1px,transparent 1.2px) 0 0/22px 22px, #0E0E11}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.board{position:absolute;left:0;top:0;width:1000px;height:620px;transform-origin:0 0;background:var(--ink);border-radius:6px;box-shadow:0 30px 90px #000c;overflow:hidden}
.board .bname{position:absolute;left:0;top:-22px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.el{position:absolute;cursor:default;user-select:none;transition:box-shadow .15s}
.el[hidden]{display:none!important}
.edit .el{cursor:move}
.edit .el:hover{box-shadow:0 0 0 1.5px #7cf3ff88}
.el.txt{white-space:pre-wrap;line-height:1.02}
.el img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none;border-radius:inherit}
.el[contenteditable="true"]{cursor:text;outline:1.5px dashed var(--lime);outline-offset:4px}
.selbox{position:absolute;pointer-events:none;border:1.5px solid var(--sel);z-index:50;display:none}
.selbox i{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--sel)}
.selbox i:nth-child(1){left:-5px;top:-5px}.selbox i:nth-child(2){right:-5px;top:-5px}.selbox i:nth-child(3){left:-5px;bottom:-5px}.selbox i:nth-child(4){right:-5px;bottom:-5px}
.selbox b{position:absolute;left:-1.5px;top:-24px;background:var(--sel);color:var(--ink);font:700 11px var(--f-mono);padding:3px 6px;border-radius:4px 4px 4px 0;white-space:nowrap}
.selbox em{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);background:var(--sel);color:var(--ink);font:500 10px var(--f-mono);padding:2px 6px;border-radius:4px;font-style:normal;white-space:nowrap}
/* рентген */
.xray{position:absolute;inset:0;z-index:40;pointer-events:none;background:#0B0B0Df2;clip-path:inset(0 0 0 var(--cut,50%));display:none}
.xray .bx{position:absolute;border:1px dashed #7cf3ff99;border-radius:3px}
.xray .bx span{position:absolute;left:4px;top:3px;font:500 11px var(--f-mono);color:var(--sel)}
.xray .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ff6b5e10 0 calc((100% - 120px)/12),transparent 0 calc((100% - 120px)/12 + 10px));margin:0 60px}
.divider{position:absolute;top:0;bottom:0;width:2px;background:var(--lime);z-index:45;left:var(--cut,50%);display:none;cursor:ew-resize;touch-action:none}
.divider::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:16px;font-weight:700}
.mode-xray .xray,.mode-xray .divider{display:block}
/* код */
.code{height:200px;flex:none;border-top:1px solid var(--line);background:#09090B;display:flex;flex-direction:column;min-height:0}
.code .tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.code .tabs span{padding:7px 12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-radius:7px 7px 0 0}
.code .tabs span.on{background:#141418;color:var(--paper)}
.code .tabs .ai{margin-left:auto;color:var(--lime)}
pre{margin:0;flex:1;overflow:auto;padding:12px 16px;font:400 12.5px/1.65 var(--f-mono);color:#D7D5DC;tab-size:2}
.k{color:#C792EA}.s{color:var(--lime)}.n{color:#FFB86B}.c{color:#6C6A75}.p{color:var(--sel)}
.flash{animation:fl .6s ease}
@keyframes fl{from{background:#d7ff3d33}to{background:transparent}}
.mode-code .viewport{display:none}.mode-code .code{flex:1;height:auto}
/* інспектор */
.field{display:flex;flex-direction:column;gap:7px}
.field .h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.field .h b{color:var(--paper);font-family:var(--f-mono);font-weight:500}
input[type=range]{width:100%;accent-color:var(--lime)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink) inset}
.xy{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xy label{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.xy input{width:100%;background:none;border:0;outline:none;color:var(--paper)}
.empty{padding:18px 14px;color:var(--muted);line-height:1.6}
.aicard{margin:14px;border-radius:14px;border:1px solid #d7ff3d44;background:linear-gradient(180deg,#d7ff3d12,transparent);padding:14px;display:flex;flex-direction:column;gap:10px}
.aicard .t{font-family:var(--f-mono);font-size:11px;color:var(--lime);letter-spacing:.06em}
.aicard p{margin:0;line-height:1.55;font-size:13px}
.aicard .bs{display:flex;gap:8px;flex-wrap:wrap}
.aicard .bs button{padding:8px 11px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--panel2)}
.aicard .bs .mine{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.verdict{font-size:12px;color:var(--lime);font-family:var(--f-mono)}
/* привид-курсор */
.ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;transition:transform .7s cubic-bezier(.6,.05,.3,1);display:none}
.ghost svg{display:block;filter:drop-shadow(0 4px 8px #0008)}
.ghost span{position:absolute;left:18px;top:20px;background:var(--lime);color:var(--ink);font:700 11px var(--f-body);padding:4px 8px;border-radius:0 8px 8px 8px;white-space:nowrap}
.ghost.click svg{transform:scale(.85)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;padding:11px 16px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:700;z-index:400;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.skip{position:fixed;right:18px;bottom:18px;z-index:310;display:none}
.preview .left,.preview .right,.preview .code{display:none}.preview .main{grid-template-columns:1fr}
.blink{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* вузькі екрани */
.mclose{display:none}
.txtbtn{margin-top:8px;align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:12px}
.txtbtn:hover{border-color:var(--lime)}
@media (max-width:900px){
  /* телефон: сторінки — смуга чипів, полотно на пів екрана, інспектор — шторка знизу */
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto;grid-template-columns:minmax(0,1fr);align-content:start;padding-bottom:70px}
  .top,.left,.stage{min-width:0}
  .top{flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px}
  .top .seg{order:5;width:100%;margin-left:0;display:grid;grid-template-columns:repeat(3,1fr)}
  .top .seg button{padding:10px 6px}
  #play{display:none}
  .file,.collab{display:none}
  .back{margin-left:auto}
  .main{grid-template-columns:minmax(0,1fr);align-content:start}
  .left{display:block;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .left .sec{display:none}
  .left .sec:first-child{display:flex;padding:8px 12px}
  .left .sec:first-child .lbl{display:none}
  #pages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #pages .row{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  .stage{height:44vh;min-height:300px}
  .board{touch-action:none}
  .code{display:none}
  .mode-code .code{display:flex;height:70vh}
  .right{position:fixed;left:0;right:0;bottom:0;z-index:200;max-height:46vh;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    transform:translateY(calc(100% - 56px));transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 60px #000a;padding-bottom:env(safe-area-inset-bottom)}
  .right.open{transform:none}
  .right::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#ffffff33;margin:8px auto 0}
  .right .sec{padding:10px 16px}
  .right .sec.pos{display:none}
  .right .empty{padding:6px 16px 16px}
  .mclose{display:inline-flex;position:absolute;right:12px;top:14px;background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
  .aicard{margin:10px 16px 16px}
  .toast{bottom:auto;top:70px}
  .skip{bottom:calc(64px + env(safe-area-inset-bottom));top:auto;right:12px}
}
@media (prefers-reduced-motion: reduce){.ghost{transition:none}.flash,.blink{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo"><span class="m"><i>&lt;</i>N<i>/&gt;</i></span> NAIDA BUREAU</div>
    <div class="file">naidabureau.site / <b id="fname">Головна</b></div>
    <div class="collab" aria-label="Зараз редагують"><span style="background:var(--lime);color:var(--ink)">НН</span><span style="background:#2B3AFF">AI</span><span style="background:#3a3a42">Ви</span></div>
    <div class="seg" role="group" aria-label="Режим">
      <button type="button" data-mode="design" aria-pressed="true">Дизайн</button>
      <button type="button" data-mode="xray" aria-pressed="false">Рентген</button>
      <button type="button" data-mode="code" aria-pressed="false">Код</button>
    </div>
    <button class="btn g" type="button" id="play">▶ Перегляд</button>
    <a class="btn" href="#contact" id="hire">Замовити</a>
    <a class="back" href="./">← головна</a>
  </header>

  <div class="main">
    <aside class="left" aria-label="Сторінки і шари">
      <div class="sec"><div class="lbl">Сторінки</div><div id="pages"></div></div>
      <div class="sec"><div class="lbl">Шари</div><div id="layers"></div></div>
      <div class="sec"><div class="lbl">Підказка</div><span style="color:var(--muted);line-height:1.6">Клікніть елемент на полотні, тягніть його, двічі клікніть по тексту, щоб переписати. Спробуйте режим «Рентген».</span></div>
    </aside>

    <section class="stage" id="stage" aria-label="Полотно">
      <div class="viewport" id="vp">
        <div class="board edit" id="board">
          <div class="xray" id="xray"><div class="grid"></div></div>
          <div class="divider" id="div" role="slider" aria-label="Межа рентгену" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"></div>
          <div class="selbox" id="sel"><i></i><i></i><i></i><i></i><b></b><em></em></div>
        </div>
      </div>
      <div class="code" id="codep">
        <div class="tabs"><span class="on" id="ctab">styles.css</span><span>Page.jsx</span><span class="ai">● AI пише, Наталія перевіряє</span></div>
        <pre id="code" aria-live="polite"></pre>
      </div>
    </section>

    <aside class="right" id="insp" aria-label="Інспектор"></aside>
  </div>
</div>

<div class="ghost" id="ghost" aria-hidden="true"><svg width="22" height="24" viewBox="0 0 22 24"><path d="M2 2l17 9-7.5 2L8 21z" fill="#D7FF3D" stroke="#0B0B0D" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Наталія</span></div>
<button class="btn g skip" type="button" id="skip">Пропустити демо →</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SW = ['#F4F2EC', '#0B0B0D', '#D7FF3D', '#7CF3FF', '#FF6B5E', '#2B3AFF'];

/* ---------- модель сторінок ---------- */
const PAGES = {
  home: { name: 'Головна', els: [
    { id: 'mark', name: 'Знак', tag: 'div', kind: 'mark', x: 60, y: 52, fs: 30, color: '#F4F2EC', accent: '#D7FF3D' },
    { id: 'badge', name: 'Бейдж', tag: 'span', kind: 'txt', text: 'дизайн + код + контроль', x: 60, y: 150, fs: 13, color: '#0B0B0D', bg: '#D7FF3D', r: 999, pad: '8px 14px', font: 'mono' },
    { id: 'title', name: 'Заголовок', tag: 'h1', kind: 'txt', text: 'NAIDA\nBUREAU.', x: 56, y: 196, fs: 104, color: '#F4F2EC', font: 'display' },
    { id: 'sub', name: 'Підзаголовок', tag: 'p', kind: 'txt', text: 'Дизайнерка і фулстак-розробниця.\nДизайн — мій. Код — з AI. Контроль — мій.', x: 60, y: 432, fs: 17, color: '#A3A1AA', font: 'body', w: 460 },
    { id: 'cta', name: 'Кнопка', tag: 'button', kind: 'txt', text: 'Замовити проєкт →', x: 60, y: 510, fs: 16, color: '#0B0B0D', bg: '#D7FF3D', r: 14, pad: '16px 24px', font: 'bodyb' },
    { id: 'phone', name: 'Телефон', tag: 'img', kind: 'img', src: 'works/vidvazhni-home-light.jpg', x: 640, y: 70, w: 230, h: 498, r: 32, border: '7px solid #26262C', rot: 4 },
    { id: 'chip', name: 'Мітка', tag: 'span', kind: 'txt', text: '● Відважні.PRO · live', x: 560, y: 470, fs: 12, color: '#F4F2EC', bg: '#141417', r: 10, pad: '9px 12px', font: 'mono', border: '1px solid #26262C' },
  ] },
  work: { name: 'Роботи', els: [
    { id: 'wt', name: 'Заголовок', tag: 'h2', kind: 'txt', text: 'Роботи', x: 60, y: 50, fs: 64, color: '#F4F2EC', font: 'display' },
    { id: 'w1', name: 'Чисті серця', tag: 'img', kind: 'img', src: 'works/pureheart-hero.jpg', x: 60, y: 170, w: 470, h: 294, r: 16, border: '1px solid #26262C' },
    { id: 'w1c', name: 'Підпис 1', tag: 'p', kind: 'txt', text: 'Чисті серця Калуш · сайт\n2022 → редизайн 2026', x: 60, y: 484, fs: 15, color: '#A3A1AA', font: 'mono' },
    { id: 'w2', name: 'Відважні', tag: 'img', kind: 'img', src: 'works/vidvazhni-catalog-dark.jpg', x: 600, y: 90, w: 210, h: 455, r: 30, border: '7px solid #26262C', rot: -3 },
    { id: 'w2c', name: 'Підпис 2', tag: 'p', kind: 'txt', text: 'Відважні.PRO · застосунок', x: 600, y: 560, fs: 15, color: '#A3A1AA', font: 'mono' },
  ] },
  services: { name: 'Послуги', els: [
    { id: 'st', name: 'Заголовок', tag: 'h2', kind: 'txt', text: 'Що я створюю', x: 60, y: 50, fs: 64, color: '#F4F2EC', font: 'display' },
    { id: 's1', name: 'Лендинги', tag: 'div', kind: 'txt', text: 'Лендинги', x: 60, y: 190, fs: 30, color: '#0B0B0D', bg: '#D7FF3D', r: 22, pad: '34px 30px', font: 'display' },
    { id: 's2', name: 'Сайти', tag: 'div', kind: 'txt', text: 'Сайти', x: 320, y: 230, fs: 30, color: '#F4F2EC', bg: '#141417', r: 22, pad: '34px 30px', font: 'display', border: '1px solid #26262C' },
    { id: 's3', name: 'Застосунки', tag: 'div', kind: 'txt', text: 'Застосунки', x: 540, y: 180, fs: 30, color: '#0B0B0D', bg: '#F4F2EC', r: 22, pad: '34px 30px', font: 'display' },
    { id: 's4', name: 'Боти', tag: 'div', kind: 'txt', text: 'Віджети й боти', x: 200, y: 380, fs: 30, color: '#F4F2EC', bg: '#2B3AFF', r: 22, pad: '34px 30px', font: 'display' },
    { id: 's5', name: 'Ціна', tag: 'p', kind: 'txt', text: 'вартість — після короткої розмови', x: 620, y: 420, fs: 15, color: '#A3A1AA', font: 'mono' },
  ] },
  contact: { name: 'Контакт', els: [
    { id: 'ct', name: 'Заголовок', tag: 'h2', kind: 'txt', text: 'Зробимо\n«вау»\nразом?', x: 60, y: 60, fs: 90, color: '#0B0B0D', font: 'display' },
    { id: 'cm', name: 'Email', tag: 'p', kind: 'txt', text: 'naidadesign.int@gmail.com', x: 60, y: 405, fs: 22, color: '#0B0B0D', font: 'mono' },
    { id: 'cph', name: 'Телефон', tag: 'p', kind: 'txt', text: '+380 93 000 37 43', x: 60, y: 442, fs: 20, color: '#0B0B0D', font: 'mono' },
    { id: 'cb', name: 'Кнопка', tag: 'button', kind: 'txt', text: 'Написати мені →', x: 60, y: 490, fs: 16, color: '#D7FF3D', bg: '#0B0B0D', r: 14, pad: '16px 24px', font: 'bodyb' },
    { id: 'cw', name: 'Водяний знак', tag: 'div', kind: 'mark', x: 520, y: 210, fs: 170, color: '#0B0B0D', accent: '#0B0B0D', op: .1 },
  ], bg: '#D7FF3D' },
};
const FONTS = { display: "'Dela Gothic One',sans-serif", mono: "'JetBrains Mono',monospace", body: "'Manrope',sans-serif", bodyb: "'Manrope',sans-serif" };
const AI = {
  title: ['Зробити заголовок фіолетовим градієнтом — зараз так модно.', (e) => { e.color = '#F4F2EC'; e.fs = 112; }, 'Лишаю світлий, але роблю більшим: бренд — це контраст, а не мода.'],
  cta: ['Змінити кнопку на синю, щоб «виділялась».', (e) => { e.bg = '#D7FF3D'; e.r = 999; }, 'Салатовий — колір дії в бренді. Тільки заокруглюю сильніше.'],
  phone: ['Поставити телефон рівно, без нахилу.', (e) => { e.rot = 6; }, 'Нахил дає рух і живість. Навіть трохи посилюю.'],
  badge: ['Прибрати бейдж, він зайвий.', (e) => { e.bg = '#D7FF3D'; e.fs = 14; }, 'Бейдж — головна думка про мене. Лишаю і роблю помітнішим.'],
  default: ['Додати тінь і градієнт, щоб було «багатше».', (e) => { if (e.rot === undefined) e.rot = 0; }, 'Без декору заради декору. Лишаю чисто.'],
};

/* ---------- стан ---------- */
let page = 'home', selId = null, mode = 'design', scale = 1;
const board = $('#board'), vp = $('#vp'), selbox = $('#sel'), xray = $('#xray');
const nodes = {};

function styleOf(e) {
  const s = { left: e.x + 'px', top: e.y + 'px', color: e.color || '', fontSize: (e.fs || 16) + 'px', fontFamily: FONTS[e.font] || '', fontWeight: e.font === 'bodyb' ? 700 : (e.font === 'body' ? 500 : 400),
    background: e.bg || '', borderRadius: (e.r || 0) + 'px', padding: e.pad || '', border: e.border || '', transform: e.rot ? `rotate(${e.rot}deg)` : '', opacity: e.op ?? '' };
  if (e.w) s.width = e.w + 'px'; if (e.h) s.height = e.h + 'px';
  if (e.kind === 'img') s.overflow = 'hidden';
  return s;
}
function renderBoard() {
  board.querySelectorAll('.el').forEach((n) => n.remove());
  const P = PAGES[page]; board.style.background = P.bg || 'var(--ink)';
  P.els.forEach((e) => {
    const n = document.createElement('div'); n.className = 'el' + (e.kind === 'txt' ? ' txt' : ''); n.dataset.id = e.id;
    if (e.kind === 'img') n.innerHTML = `<img src="${e.src}" alt="${esc(e.name)}">`;
    else if (e.kind === 'mark') n.innerHTML = `<span style="display:flex;align-items:center;line-height:1"><span style="font-family:var(--f-mono);font-weight:300;color:${e.accent}">&lt;</span><span style="font-family:var(--f-display)">N</span><span style="font-family:var(--f-mono);font-weight:300;color:${e.accent};letter-spacing:-.12em">/&gt;</span></span>`;
    else n.textContent = e.text;
    Object.assign(n.style, styleOf(e)); if (e.hidden) n.hidden = true;
    board.insertBefore(n, xray); nodes[e.id] = n;
  });
  renderLayers(); renderXray(); renderCode(); placeSel();
}
function upd(e) { const n = nodes[e.id]; if (!n) return; Object.assign(n.style, styleOf(e)); if (e.kind === 'mark') n.querySelectorAll('span span:not(:nth-child(2))').forEach((s) => s.style.color = e.accent); n.hidden = !!e.hidden; placeSel(); renderXray(); renderCode(true); }
const cur = () => PAGES[page].els.find((e) => e.id === selId);

/* масштаб полотна */
function fit() {
  const r = vp.getBoundingClientRect(); const pad = 48;
  scale = Math.min((r.width - pad) / 1000, (r.height - pad) / 620, 1.4);
  const top = innerWidth <= 900 ? 28 : (r.height - 620 * scale) / 2;
  board.style.transform = `translate(${(r.width - 1000 * scale) / 2}px,${top}px) scale(${scale})`;
}
new ResizeObserver(fit).observe(vp);

/* виділення */
function placeSel() {
  const e = cur(); const n = e && nodes[e.id];
  if (!n || n.hidden || mode === 'code') { selbox.style.display = 'none'; return; }
  selbox.style.display = 'block';
  Object.assign(selbox.style, { left: n.offsetLeft + 'px', top: n.offsetTop + 'px', width: n.offsetWidth + 'px', height: n.offsetHeight + 'px', transform: e.rot ? `rotate(${e.rot}deg)` : '' });
  $('b', selbox).textContent = e.name; $('em', selbox).textContent = `${n.offsetWidth} × ${n.offsetHeight}`;
}
function select(id) { selId = id; placeSel(); renderLayers(); renderInsp(); renderCode(); $('#insp').classList.toggle('open', !!id && innerWidth <= 900); }

/* шари і сторінки */
function renderPages() {
  $('#pages').innerHTML = Object.entries(PAGES).map(([k, p]) => `<button class="row" type="button" data-page="${k}" aria-current="${k === page}"><span class="ic">▭</span>${p.name}</button>`).join('');
}
function renderLayers() {
  const icon = { txt: 'T', img: '▣', mark: '&lt;/&gt;' };
  $('#layers').innerHTML = PAGES[page].els.slice().reverse().map((e) => `<div class="row${e.id === selId ? ' on' : ''}" role="button" tabindex="0" data-layer="${e.id}"><span class="ic">${icon[e.kind]}</span>${esc(e.name)}<button class="eye" type="button" data-eye="${e.id}" aria-label="Показати або сховати ${esc(e.name)}">${e.hidden ? '○' : '●'}</button></div>`).join('');
}
document.addEventListener('click', (ev) => {
  const pg = ev.target.closest('[data-page]'); if (pg) { goPage(pg.dataset.page); return; }
  const eye = ev.target.closest('[data-eye]'); if (eye) { const e = PAGES[page].els.find((x) => x.id === eye.dataset.eye); e.hidden = !e.hidden; upd(e); renderLayers(); return; }
  const ly = ev.target.closest('[data-layer]'); if (ly) select(ly.dataset.layer);
});
document.addEventListener('keydown', (ev) => { const ly = ev.target.closest && ev.target.closest('[data-layer]'); if (ly && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); select(ly.dataset.layer); } });
function goPage(k) { page = k; selId = null; $('#fname').textContent = PAGES[k].name; renderPages(); renderBoard(); renderInsp(); }

/* перетягування, редагування тексту */
let dragging = null;
board.addEventListener('pointerdown', (ev) => {
  if (mode === 'code' || ev.target.closest('#div')) return;
  const n = ev.target.closest('.el'); if (!n) { select(null); return; }
  if (n.isContentEditable) return;
  const e = PAGES[page].els.find((x) => x.id === n.dataset.id); select(e.id);
  dragging = { e, sx: ev.clientX, sy: ev.clientY, x0: e.x, y0: e.y, moved: false };
  board.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', (ev) => {
  if (!dragging) return; const d = dragging;
  const dx = (ev.clientX - d.sx) / scale, dy = (ev.clientY - d.sy) / scale;
  if (Math.abs(dx) + Math.abs(dy) > 2) d.moved = true;
  d.e.x = Math.round(d.x0 + dx); d.e.y = Math.round(d.y0 + dy); upd(d.e); syncXY();
});
board.addEventListener('pointerup', () => { dragging = null; });
board.addEventListener('dblclick', (ev) => {
  const n = ev.target.closest('.el.txt'); if (!n) return;
  editText(n, PAGES[page].els.find((x) => x.id === n.dataset.id));
});
function editText(n, e) {
  if (!n || !e) return;
  n.contentEditable = 'true'; n.focus(); document.getSelection().selectAllChildren(n);
  const done = () => { n.contentEditable = 'false'; e.text = n.innerText; renderCode(true); placeSel(); n.removeEventListener('blur', done); };
  n.addEventListener('blur', done);
  if (innerWidth <= 900) { $('#insp').classList.remove('open'); n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

/* рентген */
function renderXray() {
  xray.querySelectorAll('.bx').forEach((b) => b.remove());
  PAGES[page].els.forEach((e) => { const n = nodes[e.id]; if (!n || n.hidden) return;
    const b = document.createElement('div'); b.className = 'bx';
    Object.assign(b.style, { left: n.offsetLeft + 'px', top: n.offsetTop + 'px', width: n.offsetWidth + 'px', height: n.offsetHeight + 'px', transform: e.rot ? `rotate(${e.rot}deg)` : '' });
    b.innerHTML = `<span>&lt;${e.tag}&gt; .${e.id}</span>`; xray.appendChild(b); });
}
const div = $('#div'); let cut = 50;
function setCut(v) { cut = Math.max(0, Math.min(100, v)); board.style.setProperty('--cut', cut + '%'); div.setAttribute('aria-valuenow', Math.round(cut)); }
div.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); div.setPointerCapture(ev.pointerId);
  const mv = (e) => { const r = board.getBoundingClientRect(); setCut((e.clientX - r.left) / r.width * 100); };
  const up = () => { div.removeEventListener('pointermove', mv); div.removeEventListener('pointerup', up); };
  div.addEventListener('pointermove', mv); div.addEventListener('pointerup', up); });
div.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') setCut(cut - 5); if (e.key === 'ArrowRight') setCut(cut + 5); });

/* режими */
document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) { mode = m; document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.mode === m));
  $('#stage').className = 'stage mode-' + m; if (m !== 'code') requestAnimationFrame(() => { fit(); renderXray(); placeSel(); }); renderCode(); }
$('#play').onclick = () => { const on = $('#app').classList.toggle('preview'); board.classList.toggle('edit', !on); $('#play').textContent = on ? '✎ Редагувати' : '▶ Перегляд'; selbox.style.display = 'none';
  if (on) PAGES[page].els.forEach((e, i) => { const n = nodes[e.id]; n.style.animation = 'none'; n.offsetWidth; n.style.animation = reduce ? '' : `rise .6s ${i * .08}s cubic-bezier(.2,.8,.2,1) both`; });
  requestAnimationFrame(fit); };
$('#hire').onclick = (ev) => { ev.preventDefault(); goPage('contact'); toast('Сторінка «Контакт» — пишіть, обговоримо ваш проєкт'); };

/* код */
function cssOf(e) {
  const L = [`  <span class="p">left</span>: <span class="n">${e.x}px</span>;`, `  <span class="p">top</span>: <span class="n">${e.y}px</span>;`];
  if (e.kind !== 'img') L.push(`  <span class="p">font-size</span>: <span class="n">${e.fs}px</span>;`, `  <span class="p">color</span>: <span class="s">${e.color}</span>;`);
  if (e.bg) L.push(`  <span class="p">background</span>: <span class="s">${e.bg}</span>;`);
  if (e.r) L.push(`  <span class="p">border-radius</span>: <span class="n">${e.r}px</span>;`);
  if (e.rot) L.push(`  <span class="p">transform</span>: rotate(<span class="n">${e.rot}deg</span>);`);
  if (e.hidden) L.push(`  <span class="p">display</span>: <span class="s">none</span>;`);
  return `<span class="k">.${e.id}</span> {\n${L.join('\n')}\n}`;
}
function renderCode(flash) {
  const pre = $('#code'); const e = cur(); let html;
  if (mode === 'code' || !e) {
    const P = PAGES[page];
    html = `<span class="c">// ${P.name} · згенеровано разом з AI, перевірено Наталією ✓</span>\n<span class="k">export default function</span> <span class="s">${page[0].toUpperCase() + page.slice(1)}</span>() {\n  <span class="k">return</span> (\n    &lt;<span class="p">section</span> className=<span class="s">"page"</span>&gt;\n` +
      P.els.map((x) => x.kind === 'img' ? `      &lt;<span class="p">img</span> className=<span class="s">"${x.id}"</span> src=<span class="s">"${x.src}"</span> /&gt;` : x.kind === 'mark' ? `      &lt;<span class="p">Mark</span> className=<span class="s">"${x.id}"</span> /&gt;` : `      &lt;<span class="p">${x.tag}</span> className=<span class="s">"${x.id}"</span>&gt;${esc(x.text.replace(/\n/g, ' '))}&lt;/<span class="p">${x.tag}</span>&gt;`).join('\n') +
      `\n    &lt;/<span class="p">section</span>&gt;\n  );\n}\n\n` + P.els.map(cssOf).join('\n\n');
    $('#ctab').textContent = 'Page.jsx';
  } else { html = `<span class="c">/* ${esc(e.name)} — змінюйте праворуч, код оновлюється */</span>\n` + cssOf(e); $('#ctab').textContent = 'styles.css'; }
  pre.innerHTML = html;
  if (flash) { pre.classList.remove('flash'); void pre.offsetWidth; pre.classList.add('flash'); }
}

/* інспектор */
function renderInsp() {
  const box = $('#insp'), e = cur();
  if (!e) { box.innerHTML = `<div class="sec"><div class="lbl">Інспектор</div></div><div class="empty">Оберіть будь-який елемент на полотні — тут з’являться його властивості й підказка AI.<br><br>Сторінка: <b style="color:var(--paper)">${PAGES[page].name}</b> · елементів: ${PAGES[page].els.length}</div>`; return; }
  const ai = AI[e.id] || AI.default;
  const swatch = (prop) => `<div class="sw" role="group" aria-label="${prop === 'bg' ? 'Фон' : 'Колір'}">${SW.map((c) => `<button type="button" style="background:${c}" data-sw="${prop}" data-c="${c}" aria-label="${c}" aria-pressed="${(e[prop] || '').toUpperCase() === c}"></button>`).join('')}</div>`;
  box.innerHTML = `
    <div class="sec" style="position:relative"><div class="lbl">Елемент</div><div style="font-family:var(--f-display);font-size:18px">${esc(e.name)}</div><div style="font-family:var(--f-mono);color:var(--muted)">&lt;${e.tag}&gt; .${e.id}</div>${e.kind === 'txt' ? '<button type="button" class="txtbtn" id="edtxt">✎ Переписати текст</button>' : ''}<button type="button" class="mclose" id="mclose">Готово</button></div>
    <div class="sec pos"><div class="lbl">Позиція</div><div class="xy"><label>X <input id="ix" type="number" value="${e.x}"></label><label>Y <input id="iy" type="number" value="${e.y}"></label></div></div>
    ${e.kind !== 'img' ? `<div class="sec"><div class="field"><div class="h">Колір${e.kind === 'mark' ? ' знака' : ' тексту'}</div>${swatch(e.kind === 'mark' ? 'accent' : 'color')}</div>
      <div class="field" style="margin-top:8px"><div class="h">Розмір <b id="vfs">${e.fs}px</b></div><input type="range" id="fs" min="10" max="180" value="${e.fs}"></div></div>` : ''}
    ${e.bg !== undefined ? `<div class="sec"><div class="field"><div class="h">Фон</div>${swatch('bg')}</div></div>` : ''}
    ${e.r !== undefined ? `<div class="sec"><div class="field"><div class="h">Заокруглення <b id="vr">${e.r}px</b></div><input type="range" id="rr" min="0" max="60" value="${Math.min(60, e.r)}"></div></div>` : ''}
    <div class="sec"><div class="field"><div class="h">Нахил <b id="vrot">${e.rot || 0}°</b></div><input type="range" id="rot" min="-20" max="20" value="${e.rot || 0}"></div></div>
    <div class="aicard"><span class="t">● AI ПРОПОНУЄ</span><p>${ai[0]}</p><div class="bs"><button type="button" id="aiyes">Прийняти</button><button type="button" class="mine" id="aimine">Моє рішення</button></div><span class="verdict" id="verdict" hidden></span></div>`;
  const et = $('#edtxt'); if (et) et.onclick = () => editText(nodes[e.id], e);
  $('#mclose').onclick = () => select(null);
  const bind = (id, fn) => { const n = $('#' + id); if (n) n.addEventListener('input', fn); };
  bind('ix', (ev) => { e.x = +ev.target.value; upd(e); }); bind('iy', (ev) => { e.y = +ev.target.value; upd(e); });
  bind('fs', (ev) => { e.fs = +ev.target.value; $('#vfs').textContent = e.fs + 'px'; upd(e); });
  bind('rr', (ev) => { e.r = +ev.target.value; $('#vr').textContent = e.r + 'px'; upd(e); });
  bind('rot', (ev) => { e.rot = +ev.target.value; $('#vrot').textContent = e.rot + '°'; upd(e); });
  box.querySelectorAll('[data-sw]').forEach((b) => b.onclick = () => { e[b.dataset.sw] = b.dataset.c; upd(e); box.querySelectorAll(`[data-sw="${b.dataset.sw}"]`).forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  $('#aiyes').onclick = () => { const v = $('#verdict'); v.hidden = false; v.style.color = 'var(--muted)'; v.textContent = 'Можна. Але тут я б подумала ще раз 🙂'.replace(' 🙂', '') ; toast('AI запропонував — вирішуєте ви. А в моїх проєктах вирішую я.'); };
  $('#aimine').onclick = () => { ai[1](e); upd(e); renderInsp(); const v = $('#verdict'); v.hidden = false; v.textContent = '✓ ' + ai[2]; toast('Рішення за Наталією ✓'); };
}
function syncXY() { const x = $('#ix'), y = $('#iy'), e = cur(); if (x && e) { x.value = e.x; y.value = e.y; } }

let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2800); }

/* ---------- демо: курсор Наталії збирає сторінку ---------- */
const ghost = $('#ghost'), skipB = $('#skip');
let demoOn = false, demoTimer = [];
const wait = (ms) => new Promise((r) => demoTimer.push(setTimeout(r, ms)));
function moveTo(el, dx = .5, dy = .5) { const r = el.getBoundingClientRect(); ghost.style.transform = `translate(${r.left + r.width * dx}px,${r.top + r.height * dy}px)`; }
async function click() { ghost.classList.add('click'); await wait(140); ghost.classList.remove('click'); }
async function demo() {
  if (reduce) { renderBoard(); return; }
  demoOn = true; ghost.style.display = 'block'; skipB.style.display = 'inline-flex';
  ghost.style.transform = `translate(${innerWidth * .5}px,${innerHeight + 40}px)`;
  const P = PAGES.home.els, T = P.find((e) => e.id === 'title'), C = P.find((e) => e.id === 'cta'), PH = P.find((e) => e.id === 'phone');
  const full = T.text; T.text = ''; const px = PH.x; PH.x = 1080; C.bg = '#2A2A30'; C.color = '#F4F2EC';
  renderBoard(); await wait(500);
  // 1 заголовок друкується
  select('title'); moveTo(nodes.title, .1, .4); await wait(800);
  for (let i = 1; i <= full.length && demoOn; i++) { T.text = full.slice(0, i); nodes.title.textContent = T.text; placeSel(); renderCode(); await wait(70); }
  // 2 кнопка: колір
  select('cta'); moveTo(nodes.cta); await wait(800); await click();
  const sw = document.querySelector('[data-sw="bg"][data-c="#D7FF3D"]'); if (sw) { moveTo(sw); await wait(800); await click(); C.bg = '#D7FF3D'; C.color = '#0B0B0D'; upd(C); renderInsp(); }
  // 3 телефон затягується
  select('phone'); moveTo(nodes.phone, .3, .3); await wait(800);
  for (let k = 0; k <= 20 && demoOn; k++) { PH.x = Math.round(1080 + (px - 1080) * (1 - Math.pow(1 - k / 20, 3))); upd(PH); moveTo(nodes.phone, .3, .3); await wait(35); }
  // 4 AI пропонує, рішення за Наталією
  select('cta'); await wait(500); const mine = $('#aimine'); if (mine) { moveTo(mine); await wait(1000); await click(); mine.click(); }
  await wait(900); endDemo('Тепер ваша черга: клікайте, тягніть, міняйте кольори');
}
function endDemo(msg) {
  if (!demoOn) return; demoOn = false; demoTimer.forEach(clearTimeout); demoTimer = [];
  const P = PAGES.home.els; const T = P.find((e) => e.id === 'title'); T.text = 'NAIDA\nBUREAU.';
  const PH = P.find((e) => e.id === 'phone'); PH.x = 640; const C = P.find((e) => e.id === 'cta'); C.bg = C.bg === '#2A2A30' ? '#D7FF3D' : C.bg; C.color = '#0B0B0D';
  ghost.style.display = 'none'; skipB.style.display = 'none'; if (page === 'home') renderBoard(); select(null); toast(msg || 'Готово. Клікайте на будь-що');
}
skipB.onclick = () => endDemo();

/* старт */
renderPages(); fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { renderBoard(); renderInsp(); demo(); });
addEventListener('resize', () => { fit(); placeSel(); });
})();
</script>
</body>
</html>
